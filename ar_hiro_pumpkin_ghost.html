<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR ผีน้อยรอบฟักทอง 🎃👻</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    .title {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
    }
  </style>
</head>

<body>
<div class="title">🎃 พบ Hiro แล้ว! 👻</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="antialias: true; alpha: true; colorManagement: true;"
  arjs="sourceType: webcam; detectionMode: mono; matrixCodeType: 3x3; debugUIEnabled: false;"
>
  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 1.5" position="2 4 3"></a-entity>

  <a-marker preset="hiro" id="hiro-marker">

    <a-entity id="scene">

      <!-- ฟักทอง -->
      <a-entity id="pumpkin" position="0 0.45 0" scale="1.2 1.2 1.2">
        <a-sphere position="0 0 0" scale="0.75 0.65 0.7" color="#ff8c00"></a-sphere>
        <a-sphere position="-0.35 0 0" scale="0.45 0.62 0.6" color="#ff7518"></a-sphere>
        <a-sphere position="0.35 0 0" scale="0.45 0.62 0.6" color="#ff7518"></a-sphere>

        <a-cylinder position="0 0.63 0" radius="0.11" height="0.28" color="#4caf50"></a-cylinder>

        <a-entity
          geometry="primitive: triangle; vertexA: 0 0.13 0; vertexB: -0.15 -0.12 0; vertexC: 0.15 -0.12 0;"
          material="color: #222"
          position="-0.22 0.05 -0.58"></a-entity>

        <a-entity
          geometry="primitive: triangle; vertexA: 0 0.13 0; vertexB: -0.15 -0.12 0; vertexC: 0.15 -0.12 0;"
          material="color: #222"
          position="0.22 0.05 -0.58"></a-entity>

        <a-torus position="0 -0.15 -0.58" rotation="90 0 0"
                 radius="0.13" radius-tubular="0.035" color="#222"></a-torus>
      </a-entity>

      <!-- ผีน้อย -->
      <a-entity id="ghost-orbit" position="0 1.35 0">
        <a-entity id="ghost" scale="0.45 0.45 0.45">

          <a-entity
            geometry="primitive: sphere; radius: 1;"
            scale="0.8 1 0.65"
            material="color: #ffffff; roughness: 0.25;">
          </a-entity>

          <a-entity
            geometry="primitive: cone; radiusBottom: 0.82; radiusTop: 0; height: 0.65;"
            position="0 -0.55 0"
            rotation="180 0 0"
            material="color: #ffffff">
          </a-entity>

          <a-sphere position="-0.28 0.12 -0.61" radius="0.13" color="#222"></a-sphere>
          <a-sphere position="0.28 0.12 -0.61" radius="0.13" color="#222"></a-sphere>

          <a-sphere position="-0.45 -0.12 -0.56" radius="0.09"
                    color="#ff9bb5" opacity="0.8"></a-sphere>
          <a-sphere position="0.45 -0.12 -0.56" radius="0.09"
                    color="#ff9bb5" opacity="0.8"></a-sphere>

          <a-torus position="0 -0.18 -0.61" rotation="90 0 0"
                   radius="0.14" radius-tubular="0.035" color="#222"></a-torus>

          <a-entity
            geometry="primitive: cylinder; radius: 0.07; height: 0.55;"
            position="-0.75 -0.05 0"
            rotation="0 0 -55"
            material="color: #ffffff">
          </a-entity>

          <a-entity
            geometry="primitive: cylinder; radius: 0.07; height: 0.55;"
            position="0.75 -0.05 0"
            rotation="0 0 55"
            material="color: #ffffff">
          </a-entity>

        </a-entity>
      </a-entity>

      <!-- ประกายดาว -->
      <a-entity
        position="0 1.5 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;"
      >
        <a-text value="✦" color="#fff59d" align="center"
                position="-1 0 0" scale="0.7 0.7 0.7"></a-text>
        <a-text value="✦" color="#fff59d" align="center"
                position="1 0.5 0" scale="0.5 0.5 0.5"></a-text>
        <a-text value="✦" color="#ffffff" align="center"
                position="0 1 0" scale="0.45 0.45 0.45"></a-text>
      </a-entity>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const orbit = document.querySelector("#ghost-orbit");
  const ghost = document.querySelector("#ghost");
  let angle = 0;

  function animateGhost() {
    angle += 0.025;

    const radiusX = 1.25;
    const radiusZ = 0.75;

    const x = Math.cos(angle) * radiusX;
    const z = Math.sin(angle) * radiusZ;
    const y = 1.25 + Math.sin(angle * 2.2) * 0.15;

    orbit.setAttribute("position", `${x} ${y} ${z}`);

    const rotationY = Math.atan2(-x, -z) * 180 / Math.PI;
    ghost.setAttribute("rotation", `0 ${rotationY} 0`);

    requestAnimationFrame(animateGhost);
  }

  animateGhost();

  const marker = document.querySelector("#hiro-marker");

  marker.addEventListener("markerFound", () => {
    console.log("🎃 Hiro marker found!");

    const scene = document.querySelector("#scene");
    scene.setAttribute(
      "animation__appear",
      "property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 700; easing: easeOutElastic;"
    );
  });

  marker.addEventListener("markerLost", () => {
    console.log("Hiro marker lost");
  });
</script>

</body>
</html>
